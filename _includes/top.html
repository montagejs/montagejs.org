<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">

    <title>{{ page.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/normalize.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/base.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/pages.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/solarized.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/teaser.css">
    {% if page.home %}
    <link rel="stylesheet" href="{{ site.baseurl }}/stylesheets/index.css">
    {% endif %}
    <!--[if lt IE 9]><script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script><![endif]-->
    {% if page.api %}
    <script src="scripts/prettify/prettify.js"></script>
    <script src="scripts/prettify/lang-css.js"></script>
    <script src="scripts/search.js"></script>
    <link rel="stylesheet" href="styles/prettify-tomorrow.css">
    <link rel="stylesheet" href="styles/jsdoc-default.css">
    {% endif %}
    {% if page.blog %}
    <link rel="alternate" type="application/atom+xml" title="Mod Blog" href="http://feeds.feedburner.com/MontageJSBlog" />
    {% endif %}
  </head>
